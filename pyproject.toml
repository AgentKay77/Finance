[project]
name = "finance-hub"
version = "0.1.0"
description = "Self-hosted personal finance hub PWA (loans, net worth, bills, goals, subscriptions)"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.2",
    "WTForms>=3.1",
    "email-validator>=2.0",
    "SQLAlchemy>=2.0",
    "Flask-SQLAlchemy>=3.1",
    "alembic>=1.13",
    "Flask-Migrate>=4.0",
    "bcrypt>=4.1",
    "python-dotenv>=1.0",
    "gunicorn>=21.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app/services"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
