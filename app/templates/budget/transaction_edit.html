{% extends "base.html" %}
{% block title %}Edit transaction · {{ app_name }}{% endblock %}
{% block content %}
<section class="card">
  <h1>Edit transaction</h1>
  <form method="post" class="form-grid">
    {{ form.hidden_tag() }}
    {% for field in [form.category_id, form.amount, form.txn_date, form.note] %}
      <label>
        <span>{{ field.label.text }}</span>
        {{ field() }}
      </label>
    {% endfor %}
    <div class="full row-between">
      <a href="{{ url_for('budget.list_transactions') }}">Cancel</a>
      <button type="submit" class="btn btn--primary">Save</button>
    </div>
  </form>
</section>
{% endblock %}
