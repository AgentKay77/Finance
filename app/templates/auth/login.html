{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Sign in</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    <label>
      <span>Email</span>
      {{ form.email(autocomplete="username", required=True) }}
      {% for err in form.email.errors %}<small class="error">{{ err }}</small>{% endfor %}
    </label>
    <label>
      <span>Password</span>
      {{ form.password(autocomplete="current-password", required=True) }}
      {% for err in form.password.errors %}<small class="error">{{ err }}</small>{% endfor %}
    </label>
    <label class="checkbox">
      {{ form.remember() }} <span>Remember me on this device</span>
    </label>
    <button type="submit" class="btn btn--primary">Sign in</button>
  </form>
  {% if config.ALLOW_REGISTRATION %}
    <p class="muted">No account? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
  {% endif %}
</section>
{% endblock %}
